<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlockDAG Login</title>
{% set title = "BlockDAG | Node Manager" %}
<style>
  body{margin:0;background:#05080f;color:#e7eaf6;font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:0 24px}
  .header{display:flex;align-items:center;gap:10px;margin-bottom:12px;justify-content:flex-start;width:100%}
  .header img{height:40px;width:40px;border-radius:6px}
  .header h1{margin:0;font-size:18px;font-weight:600;letter-spacing:.08em;text-transform:none}
  .login-card{background:#121a33;border-radius:16px;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.45);width:400px;display:flex;flex-direction:column;align-items:flex-start}
  .login-card h1{margin:0 0 16px;font-size:20px;text-align:left}
  .login-form{max-width:320px;margin:0 auto;width:100%}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:#9aa4c7;margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em}
  .field input{width:100%;padding:6px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.04);color:#fff;font-size:14px}
  .field input:focus{outline:none;border-color:#44f2a8}
  .btn{width:100%;padding:6px 12px;border:none;border-radius:10px;background:#44f2a8;color:#05080f;font-weight:700;cursor:pointer;margin-top:8px}
  .error{color:#ff5370;font-size:13px;text-align:center;margin-bottom:8px}
</style>
<div class="logo-banner">
  <img src="{{ url_for('static', filename='3d.gif') }}" alt="BlockDAG">
  <h1>{{ title }}</h1>
</div>
  <div class="login-card">
    <h1>Login</h1>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
  <div class="login-form">
    <form method="post">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
      </div>
      <button class="btn" type="submit">Sign in</button>
    </form>
  </div>
</div>
