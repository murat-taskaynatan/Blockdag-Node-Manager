<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlockDAG Login</title>
{% set title = "BlockDAG | Node Manager" %}
<style>
  body{margin:0;background:#05080f;color:#e7eaf6;font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:0 24px}
  .login-card{background:#121a33;border-radius:16px;padding:24px;box-shadow:0 10px 40px rgba(0,0,0,.45);width:440px;min-height:360px;display:flex;gap:24px;align-items:flex-start}
  .card-header{flex:0 0 140px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
  .logo-stack{display:flex;flex-direction:column;gap:4px}
  .logo-stack img{height:48px;width:48px;border-radius:8px}
  .logo-text strong{font-size:18px;letter-spacing:.04em;display:block}
  .logo-text span{font-size:14px;color:#9aa4c7;display:block;margin-top:2px}
  .login-content{flex:1;display:flex;flex-direction:column;gap:12px}
  .login-card h1{margin:0;font-size:20px;text-align:left}
  .login-form{max-width:320px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:6px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:#9aa4c7;margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em}
  .field input{width:230px;box-sizing:border-box;padding:6px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.04);color:#fff;font-size:14px}
  .field input:focus{outline:none;border-color:#44f2a8}
  .btn{width:230px;box-sizing:border-box;padding:6px 12px;border:none;border-radius:10px;background:#44f2a8;color:#05080f;font-weight:700;cursor:pointer;margin-top:8px}
  .error{color:#ff5370;font-size:13px;text-align:center;margin-bottom:8px}
</style>
<div class="login-wrapper">
  <div class="login-card">
    <div class="card-header">
      <div class="logo-stack">
        <img src="{{ url_for('static', filename='3d.gif') }}" alt="BlockDAG">
        <div class="logo-text">
          <strong>BlockDAG</strong>
          <span>Node Manager</span>
        </div>
      </div>
    </div>
    <div class="login-content">
      <h1>Login</h1>
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
      <div class="login-form">
        <form method="post">
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password">
          </div>
          <button class="btn" type="submit">Sign in</button>
        </form>
      </div>
    </div>
  </div>
